[project]
name = "alloy"
version = "0.1.0"
description = "API for volunteer platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
]

[project.scripts]
alloy = "alloy:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mongomock-motor>=0.0.36",
    "pytest>=9.2.0",
]
